plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dani.hours'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dani.hours'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '1.3'
    }

    signingConfigs {
        // A fixed key kept in the repo, so every build can update the installed app in place.
        hours {
            storeFile file('hours.keystore')
            storePassword 'hourstracker'
            keyAlias 'hours'
            keyPassword 'hourstracker'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.hours
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
